<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web-Spider | Contact Us</title>
  <style>
    :root {
      --bg: #091423;
      --bg-2: #101f33;
      --panel: rgba(17, 27, 43, 0.9);
      --panel-border: rgba(255,255,255,0.08);
      --text: #edf6ff;
      --muted: #bfd0ea;
      --accent: #63d0ff;
      --accent-2: #8df0c3;
      --button-text: #06141d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 0 28px;
      border-bottom: 1px solid var(--panel-border);
    }

    .brand {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .brand span {
      color: var(--accent-2);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav a {
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--panel-border);
      background: rgba(255,255,255,0.03);
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .nav a:hover {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--button-text);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 40px;
      align-items: center;
      padding-top: 48px;
    }

    .hero h1 {
      font-size: clamp(2.6rem, 5vw, 4rem);
      line-height: 1.1;
      margin: 0 0 18px;
    }

    .hero h1 .highlight {
      color: var(--accent-2);
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.7;
      max-width: 560px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.18);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 0.88rem;
      margin-bottom: 6px;
    }

    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
      background: #0a1625;
      color: var(--text);
      font: inherit;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--button-text);
      font-weight: 700;
      font-size: 1rem;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
    }

    @media (max-width: 760px) {
      .hero {
        grid-template-columns: 1fr;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">web<span>-spider</span></div>
      <nav class="nav">
        <a href="mailto:your-email@example.com?subject=Contact%20Us">Contact Us</a>
      </nav>
    </header>

    <main class="hero">
      <section>
        <h1>Smart digital <span class="highlight">web experiences</span></h1>
        <p>
          Web-Spider is built for modern outreach, strong communication, and reliable online presence.
          Keep it simple and direct — only one contact option for your visitors to reach you by email.
        </p>
      </section>

      <section class="card">
        <form action="mailto:your-email@example.com" method="post" enctype="text/plain">
          <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
          </div>

          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your email" required>
          </div>

          <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
          </div>

          <button type="submit">Send Message</button>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
