<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>web-spider | Contact Us</title>
  <style>
    :root {
      --bg-1: #07131d;
      --bg-2: #0f1d2a;
      --bg-3: #162a38;
      --panel: rgba(12, 25, 37, 0.74);
      --panel-border: rgba(255,255,255,0.08);
      --text: #edf7ff;
      --muted: #c9dced;
      --accent: #72d4ff;
      --accent-2: #9ef7bf;
      --shadow: rgba(0,0,0,0.35);
      --web: rgba(160, 208, 255, 0.26);
      --web-strong: rgba(160, 208, 255, 0.42);
      --spider: #0b0e14;
      --spider-light: #dfeeff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #15304d 0%, var(--bg-2) 28%, var(--bg-1) 100%);
      color: var(--text);
      overflow-x: hidden;
    }

    body {
      position: relative;
    }

    .web-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.9;
      background:
        radial-gradient(circle at 50% 10%, rgba(255,255,255,0.15) 0 1%, transparent 1% 100%),
        radial-gradient(circle at 50% 15%, rgba(255,255,255,0.12) 0 1.2%, transparent 1.2% 100%),
        linear-gradient(90deg, transparent 49.9%, var(--web) 50%, transparent 50.1%),
        linear-gradient(0deg, transparent 49.9%, var(--web) 50%, transparent 50.1%),
        linear-gradient(45deg, transparent 49.8%, var(--web) 50%, transparent 50.2%),
        linear-gradient(-45deg, transparent 49.8%, var(--web) 50%, transparent 50.2%);
      background-size: 100% 100%, 100% 100%, 220px 220px, 220px 220px, 220px 220px, 220px 220px;
      filter: drop-shadow(0 0 10px rgba(134,190,255,0.25));
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 0 26px;
      border-bottom: 1px solid var(--panel-border);
    }

    .brand {
      font-size: clamp(2rem, 3vw, 2.8rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: lowercase;
    }

    .brand .accent {
      color: var(--accent-2);
      text-shadow: 0 0 12px rgba(158,247,191,0.5);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav a {
      display: inline-block;
      text-decoration: none;
      color: var(--text);
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--panel-border);
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 700;
      transition: 0.2s ease;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    }

    .nav a:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #04161d;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 38px;
      align-items: center;
      padding-top: 48px;
      min-height: 75vh;
    }

    .tag {
      display: inline-block;
      background: rgba(114, 212, 255, 0.08);
      border: 1px solid rgba(114,212,255,0.22);
      color: var(--accent);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2.6rem, 5vw, 5rem);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    h1 .highlight {
      color: var(--accent-2);
      text-shadow: 0 0 20px rgba(158,247,191,0.35);
    }

    .subtitle {
      max-width: 550px;
      margin: 0;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.8;
    }

    .card {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      padding: 26px;
      box-shadow: 0 28px 50px rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(6px);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 18px;
      pointer-events: none;
    }

    form {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 1;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
    }

    input, textarea {
      width: 100%;
      background: rgba(7, 22, 32, 0.8);
      color: var(--text);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    button {
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #051922;
      font-weight: 800;
      font-size: 1rem;
      border-radius: 12px;
      padding: 13px 18px;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(114,212,255,0.22);
    }

    .spider-wrap {
      position: absolute;
      right: 22px;
      top: 20px;
      width: 180px;
      height: 180px;
      pointer-events: none;
      animation: floatSpider 6s ease-in-out infinite alternate;
    }

    .web-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.06);
      box-shadow: inset 0 0 18px rgba(158,247,191,0.08), 0 0 18px rgba(114,212,255,0.18);
    }

    .web-ring::before,
    .web-ring::after {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 50%;
    }

    .web-ring::after {
      inset: 32px;
      border-color: rgba(255,255,255,0.06);
    }

    .spider {
      position: absolute;
      width: 18px;
      height: 18px;
      background: var(--spider);
      border-radius: 50%;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 8px rgba(0,0,0,0.08), 0 0 18px rgba(0,0,0,0.25);
      animation: crawl 7s ease-in-out infinite;
    }

    .spider::before,
    .spider::after {
      content: "";
      position: absolute;
      background: var(--spider-light);
      border-radius: 50%;
      width: 5px;
      height: 5px;
      top: 4px;
      left: 3px;
      box-shadow: 9px 0 0 var(--spider-light);
    }

    .spider::after {
      width: 8px;
      height: 8px;
      left: 5px;
      top: -7px;
      box-shadow: none;
      background: rgba(255,255,255,0.35);
    }

    .leg {
      position: absolute;
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
      transform-origin: left center;
      top: 50%;
      left: 50%;
    }

    .leg.l1 { transform: translate(-2px, -10px) rotate(-28deg); }
    .leg.l2 { transform: translate(-12px, -2px) rotate(-8deg); }
    .leg.l3 { transform: translate(-12px, 8px) rotate(8deg); }
    .leg.l4 { transform: translate(-2px, 16px) rotate(28deg); }
    .leg.l5 { transform: translate(5px, -10px) rotate(28deg); }
    .leg.l6 { transform: translate(13px, -2px) rotate(8deg); }
    .leg.l7 { transform: translate(13px, 8px) rotate(-8deg); }
    .leg.l8 { transform: translate(5px, 16px) rotate(-28deg); }

    @keyframes crawl {
      0% { transform: translate(-50%, -50%) translate(0, 0) rotate(0deg); }
      15% { transform: translate(-50%, -50%) translate(28px, -22px) rotate(24deg); }
      30% { transform: translate(-50%, -50%) translate(-30px, 28px) rotate(-18deg); }
      50% { transform: translate(-50%, -50%) translate(42px, 20px) rotate(30deg); }
      70% { transform: translate(-50%, -50%) translate(-24px, -26px) rotate(-24deg); }
      100% { transform: translate(-50%, -50%) translate(0, 0) rotate(0deg); }
    }

    @keyframes floatSpider {
      0% { transform: translateY(0); }
      100% { transform: translateY(10px); }
    }

    @media (max-width: 820px) {
      .hero {
        grid-template-columns: 1fr;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .spider-wrap {
        position: relative;
        right: auto;
        top: auto;
        width: 140px;
        height: 140px;
        margin: 0 auto 20px;
      }
    }
  </style>
</head>
<body>
  <div class="web-bg"></div>

  <div class="wrap">
    <header>
      <div class="brand">web<span class="accent">-spider</span></div>
      <nav class="nav">
        <a href="mailto:your-email@example.com?subject=Contact%20Us">Contact Us</a>
      </nav>
    </header>

    <main class="hero">
      <section>
        <div class="tag">Web Solutions</div>
        <h1>Smart digital <span class="highlight">web experiences</span></h1>
        <p class="subtitle">
          Built for smooth communication and strong online presence. Keep your website clean,
          focused, and easy to contact — with a spider-inspired visual touch and a single clear contact option.
        </p>
      </section>

      <section class="card">
        <div class="spider-wrap" aria-hidden="true">
          <div class="web-ring"></div>
          <div class="spider">
            <span class="leg l1"></span>
            <span class="leg l2"></span>
            <span class="leg l3"></span>
            <span class="leg l4"></span>
            <span class="leg l5"></span>
            <span class="leg l6"></span>
            <span class="leg l7"></span>
            <span class="leg l8"></span>
          </div>
        </div>

        <form action="mailto:your-email@example.com" method="post" enctype="text/plain">
          <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
          </div>

          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your email" required>
          </div>

          <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
          </div>

          <button type="submit">Send Message</button>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
