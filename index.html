<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web-Spider | Contact Us</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a2b;
      --panel-alt: #1a2642;
      --text: #eaf2ff;
      --muted: #a4b3cf;
      --accent: #5bc0ff;
      --accent-2: #87f5c5;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #08111f 0%, #101d35 100%);
      color: var(--text);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 0 26px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .brand span {
      color: var(--accent-2);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-link {
      display: inline-block;
      text-decoration: none;
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .nav-link:hover {
      background: var(--accent);
      color: #04111d;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      align-items: center;
      gap: 40px;
      padding-top: 50px;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      line-height: 1.1;
      margin: 0 0 16px;
    }

    .hero h1 .accent {
      color: var(--accent-2);
    }

    .hero p {
      margin: 0;
      font-size: 1.08rem;
      color: var(--muted);
      line-height: 1.7;
    }

    .card {
      background: rgba(18, 26, 43, 0.85);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 35px rgba(0, 0, 0, 0.18);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: #0d1628;
      color: var(--text);
      border-radius: 10px;
      padding: 12px 14px;
      font: inherit;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #04111d;
      font-weight: 700;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
    }

    @media (max-width: 760px) {
      .hero {
        grid-template-columns: 1fr;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">web<span>-spider</span></div>
      <nav>
        <a class="nav-link" href="mailto:your-email@example.com?subject=Contact%20Request">Contact Us</a>
      </nav>
    </header>

    <main class="hero">
      <section>
        <h1>Smarter digital <span class="accent">web solutions</span></h1>
        <p>
          Web-Spider helps businesses grow online with clean design, efficient communication,
          and dependable support. Reach out and send your message directly to the email inbox.
        </p>
      </section>

      <section class="card">
        <form action="mailto:your-email@example.com" method="post" enctype="text/plain">
          <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required />
          </div>

          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your email" required />
          </div>

          <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
          </div>

          <button type="submit">Send Message</button>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
